spring.application.name=tickets-rag
server.port=8081

# Archivo .env
spring.config.import=optional:file:.env[.properties]

# ---------- n8n ----------
app.n8n.webhook-url=${N8N_WEBHOOK_URL:https://germinate-had-heroism.ngrok-free.dev/webhook/analizar-ticket}

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5433/tickets
spring.datasource.username=tickets
spring.datasource.password=tickets

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect